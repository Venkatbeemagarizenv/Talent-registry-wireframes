<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging in... - Talent Registry</title>
  <link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card" style="text-align: center;">
      <div style="font-size: 48px; margin-bottom: 24px;">🔄</div>
      <h2>Logging you in...</h2>
      <p class="text-muted" style="margin-top: 16px;">
        Authenticating with ZenCube
      </p>

      <div class="progress-bar" style="margin: 24px 0;">
        <div class="progress-fill" style="width: 60%;"></div>
      </div>

      <p class="text-small text-muted">
        You'll be redirected automatically
      </p>

      <div class="wireframe-note" style="margin-top: 24px;">
        This page shows during OAuth callback processing.
        On success → redirect to Student Dashboard.
        On error → show error message with retry option.
      </div>

      <a href="../student/dashboard.html" class="btn btn-primary" style="margin-top: 16px;">
        Continue to Dashboard (Demo)
      </a>
    </div>
  </div>

  <div style="position: fixed; bottom: 20px; right: 20px; background: var(--color-heading); color: white; padding: 12px 16px; border-radius: 8px; font-size: 12px;">
    <a href="../index.html" style="color: white;">Back to Wireframe Hub</a>
  </div>
</body>
</html>
