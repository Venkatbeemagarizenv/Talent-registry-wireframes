<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating... - Talent Registry</title>
  <link rel="stylesheet" href="../assets/wireframe.css">
  <style>
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-heading);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .callback-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .callback-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 48px;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="callback-container">
    <div class="callback-card">
      <div class="spinner"></div>
      <h2 style="margin-bottom: 12px;">Authenticating...</h2>
      <p style="color: var(--color-muted); margin-bottom: 24px;">
        Verifying your ZenCube credentials and syncing your profile.
      </p>

      <div class="wireframe-note">
        This screen shows while processing OAuth callback from ZenCube.
        User will be redirected to Student Dashboard on success.
      </div>

      <div style="margin-top: 24px;">
        <p style="font-size: 13px; color: var(--color-muted);">
          Taking too long? <a href="login.html">Return to login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Wireframe Navigation -->
  <div style="position: fixed; bottom: 20px; left: 20px; background: var(--color-heading); color: white; padding: 12px 16px; border-radius: 8px; font-size: 12px;">
    <a href="../index.html" style="color: white;">← Back to Wireframe Hub</a>
  </div>
</body>
</html>
