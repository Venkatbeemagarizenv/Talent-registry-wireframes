<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ZenCube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      color: #373737;
    }

    .login-split {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- Left brand panel ---------- */
    .login-brand {
      flex: 1;
      background: linear-gradient(120deg, #0a1626 0%, #0e2742 55%, #123356 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 60px;
      color: #ffffff;
    }

    .brand-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .brand-divider {
      width: 1px;
      height: 52px;
      background: rgba(255, 255, 255, 0.35);
    }

    .login-brand h1 {
      font-size: 56px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #5d8ec4;
      line-height: 1.1;
    }

    .brand-product {
      font-size: 42px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .login-brand p {
      font-size: 18px;
      font-weight: 400;
      color: #d4dce6;
      margin-top: 14px;
    }

    /* ---------- Right form panel ---------- */
    .login-form-side {
      flex: 1;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 80px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 56px 48px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .field {
      margin-bottom: 24px;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #2b2b2b;
      margin-bottom: 10px;
    }

    .field-input {
      width: 100%;
      padding: 13px 14px;
      font-family: 'Noto Sans', sans-serif;
      font-size: 15px;
      color: #373737;
      border: 1px solid #c9c9c9;
      background: #ffffff;
    }

    .field-input:focus {
      outline: none;
      border-color: #23517F;
    }

    .field-hint {
      display: block;
      font-size: 12px;
      color: #8d8d8d;
      margin-top: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .checkbox-row input {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid #c9c9c9;
      border-radius: 0;
      background: #ffffff;
      cursor: pointer;
      position: relative;
    }

    .checkbox-row input:checked {
      background: #23517F;
      border-color: #23517F;
    }

    .checkbox-row input:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .checkbox-row label {
      font-size: 15px;
      color: #373737;
      cursor: pointer;
    }

    .btn-signin {
      width: 100%;
      padding: 15px;
      background: #2b5b96;
      color: #ffffff;
      border: none;
      font-family: 'Noto Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-signin:hover {
      background: #1f4675;
    }

    .login-footer {
      width: 100%;
      max-width: 440px;
      text-align: right;
      margin-top: 28px;
      padding-right: 0;
    }

    .login-footer a {
      color: #6b6b6b;
      font-size: 13px;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .login-footer .reach {
      display: block;
      margin-top: 14px;
      color: #6b6b6b;
    }

    .login-footer .reach a {
      color: #2b5b96;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 860px) {
      .login-split {
        flex-direction: column;
      }

      .login-brand {
        padding: 56px 40px;
        flex: none;
        text-align: center;
      }

      .login-brand h1 {
        font-size: 40px;
      }

      .login-form-side {
        align-items: center;
        padding: 40px 24px;
      }

      .login-footer {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="login-split">
    <!-- Left brand panel -->
    <section class="login-brand">
      <div class="brand-logo-row">
        <h1>ZENCUBE</h1>
        <span class="brand-divider"></span>
        <span class="brand-product">Talent Registry</span>
      </div>
      <p>A navigation system for human effort</p>
    </section>

    <!-- Right form panel -->
    <section class="login-form-side">
      <form class="login-card">
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input class="field-input" type="text" id="username" name="username">
          <span class="field-hint">Use your university-provided email address</span>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="field-input" type="password" id="password" name="password">
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="stay" checked>
          <label for="stay">Stay signed in</label>
        </div>

        <button type="submit" class="btn-signin">Sign In</button>
      </form>

      <div class="login-footer">
        <a href="#">Forgot password?</a>
        <span class="reach">Reach out to <a href="mailto:john@zenv.ai">john@zenv.ai</a></span>
      </div>
    </section>
  </div>
</body>
</html>
